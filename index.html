          <h2>先看清，再选择</h2>
          <ol class="guide-list">
            <li><span>01</span><div><strong>光线要充足</strong><p>尽量在自然光下观察体色和斑纹。</p></div></li>
            <li><span>02</span><div><strong>重点看眼柄与左螯</strong><p>多数分支会使用这两个部位的特征。</p></div></li>
            <li><span>03</span><div><strong>以成体为准</strong><p>幼体特征可能尚未完全显现。</p></div></li>
          </ol>
          <div class="scope-note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Zm0-6v-4m0-4h.01" /></svg>
            <p>本版的资料适用于判断成体陆寄居蟹，因为有些种类的幼体和成体不是完全相同的（不包含椰子蟹）。</p>
          </div>
